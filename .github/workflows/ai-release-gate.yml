name: AI release gate

# Three stages, cheapest first. Each must pass before the next starts:
#   1. unit        - hermetic tests of the framework and the mock bot
#   2. smoke-gate  - deterministic API checks, then deterministic widget checks (no LLM, no tokens)
#   3. llm-evals   - `deepeval test run` through the API adapter and the Playwright adapter
#
# Any failure fails the workflow. To block merges, add "unit", "smoke-gate" and both
# "llm-evals" checks as required status checks in the branch protection rule for `main`.
#
# Target: the bundled mock chatbot, unless the repository variable CHATBOT_BASE_URL
# points at a staging bot (set the other CHATBOT_* contract variables alongside it).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ai-release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHATBOT_BASE_URL: ${{ vars.CHATBOT_BASE_URL || 'http://127.0.0.1:8080' }}
  CHATBOT_API_KEY: ${{ secrets.CHATBOT_API_KEY }}
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
  # --- release-blocking thresholds
  EVAL_THRESHOLD_FAITHFULNESS: "0.85"
  EVAL_THRESHOLD_ANSWER_RELEVANCY: "0.85"
  EVAL_THRESHOLD_GUARDRAIL: "0.85"
  EVAL_THRESHOLD_TOXICITY_MAX: "0.15"
  # --- supporting thresholds
  EVAL_THRESHOLD_CONTEXTUAL_PRECISION: "0.70"
  EVAL_THRESHOLD_KNOWLEDGE_RETENTION: "0.80"
  EVAL_THRESHOLD_CONVERSATION_COMPLETENESS: "0.70"
  EVAL_THRESHOLD_BRAND_TONE: "0.70"
  EVAL_THRESHOLD_ESCALATION_ACCURACY: "0.80"

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest

  smoke-gate:
    name: smoke-gate
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Start mock chatbot
        if: vars.CHATBOT_BASE_URL == ''
        run: |
          nohup uvicorn mock_chatbot.app:app --port 8080 > chatbot.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          cat chatbot.log; exit 1
      - name: Stage 1 - API smoke (fail fast, no tokens spent)
        run: pytest tests/smoke/test_api_smoke.py
      - name: Install browser
        run: playwright install --with-deps chromium
      - name: Stage 2 - UI smoke
        run: pytest tests/smoke/test_ui_smoke.py
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failures
          path: artifacts
          if-no-files-found: ignore

  llm-evals:
    name: llm-evals (${{ matrix.channel }})
    needs: smoke-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets are not available to pull requests from forks.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        channel: [api, ui]
    env:
      CHATBOT_CHANNEL: ${{ matrix.channel }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_JUDGE_PROVIDER: ${{ vars.EVAL_JUDGE_PROVIDER || 'openai' }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || '' }}
      DEEPEVAL_RESULTS_FOLDER: eval-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Install browser
        if: matrix.channel == 'ui'
        run: playwright install --with-deps chromium
      - name: Start mock chatbot
        if: vars.CHATBOT_BASE_URL == ''
        run: |
          nohup uvicorn mock_chatbot.app:app --port 8080 > chatbot.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          cat chatbot.log; exit 1
      - name: Stage 3 - DeepEval (${{ matrix.channel }} channel)
        run: deepeval test run evals
      - name: Upload evaluation results and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-evals-${{ matrix.channel }}
          path: |
            eval-results
            artifacts
          if-no-files-found: ignore
