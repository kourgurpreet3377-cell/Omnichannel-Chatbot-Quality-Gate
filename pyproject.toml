[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnichannel-chatbot-quality-gate"
version = "0.1.0"
description = "Quality and release-gate framework for multi-turn chatbots: API + Playwright UI + DeepEval judge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gurpreet Kour" }]
dependencies = [
    # framework
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "playwright>=1.45",
    "pytest>=8.0",
    "deepeval>=3.0",
    # bundled mock chatbot
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Plain `pytest` runs the hermetic unit suite. Other stages are run by path:
#   pytest tests/smoke/test_api_smoke.py     deterministic API gate
#   pytest tests/smoke/test_ui_smoke.py      deterministic widget gate
#   deepeval test run evals                  LLM-judged gate
testpaths = ["tests/unit"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
    "smoke: deterministic checks against a running chatbot (no LLM judge)",
    "api: uses the REST API adapter",
    "ui: uses the Playwright widget adapter",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "evals", "."]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
